<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Insana</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="wrap"><header><div class="mark">⚔</div><div><small>COMBATE FANTÁSTICO MULTIJUGADOR</small><h1>ARENA <b>INSANA</b></h1></div><span class="live">● EN LÍNEA</span></header>
<section id="lobby" class="panel"><p class="gold">ELIGE TU LEYENDA</p><h2>Entra en la arena</h2><label>Nombre<input id="name" maxlength="16" value="Jugador"></label><p class="gold">PERSONAJES</p><div id="chars" class="cards"></div><p class="gold">MAPAS</p><div id="maps" class="cards maps"></div><div class="actions"><button id="create" class="primary">CREAR SALA PRIVADA</button><div class="join"><input id="code" placeholder="CÓDIGO"><button id="join">UNIRSE</button></div></div><p id="msg"></p></section>
<section id="game" class="panel hidden"><div class="bar"><span>SALA <b id="room">----</b></span><span id="count">1/10</span><button id="copy">COPIAR CÓDIGO</button><button id="exit">SALIR</button></div><canvas id="field" width="800" height="500"></canvas><div class="bar"><label>MAPA <select id="mapPick"><option value="bosque">Bosque antiguo</option><option value="volcan">Volcán rojo</option><option value="hielo">Reino de hielo</option><option value="ruinas">Ruinas místicas</option><option value="desierto">Desierto dorado</option><option value="castillo">Castillo oscuro</option></select></label><span>WASD / flechas: mover · Espacio: atacar · E: habilidad</span></div><div class="touch"><div class="pad"><button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><button id="hit">ATACAR</button><button id="skill">HABILIDAD</button></div><p id="roster"></p></section><footer>CREA TU EQUIPO · DOMINA CADA MAPA</footer></div><script src="/socket.io/socket.io.js"></script><script src="/game.js"></script></body></html>
